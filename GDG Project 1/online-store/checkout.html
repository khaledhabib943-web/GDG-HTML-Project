<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Page</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <form>
        <label for="name">Full Name:</label>
        <br>
        <input type="text" id="name" name="full name">
        <hr>

        <label for="email">Email:</label>
        <br>
        <input type="email" id="email" name="Email">
        <hr>

        <label for="add">Address:</label>
        <br>
        <input type="text" id="add" name="address">
        <hr>

        <label for="pho">Phone Number:</label>
        <br>
        <input type="tel" id="pho" name="phone number">
        <hr>

        <h4>Payment method</h4>
        <input type="radio" name="Pay" id="cash" value="cash">
        <label for="cash"> Cash</label>
        <input type="radio" name="Pay" id="visa" value="visa">
        <label for="visa">VISA</label>
        <input type="radio" name="Pay" id="insta" value="instapay">
        <label for="insta">InstaPay</label>
        <hr>

        <button type="submit">Submit</button>
    </form>
    
</body>
</html>
