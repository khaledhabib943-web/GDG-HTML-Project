<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Page</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <h1>My Cart</h1>
    <section>
        <table border="1" cellpadding="8" cellspacing="8">
            <thead>
                <tr>
                    <td>Product Name</td>
                    <td>Price</td>
                    <td>Quantity</td>
                    <td>Total</td>
                </tr>

            <tbody>
                <tr>
                    <td>Wood Chess Sets</td>
                    <td>1500.00</td>

                    <td>1500.00</td>

                <tr>
                    <td>Chess Clock</td>
                    <td>700.00</td>
                    <td>1</td>
                    <td>700.00</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3">Total cost</td>
                    <td>2200.00</td>
                </tr>
            </tfoot>
        </table>
        <br>
        <button><a href="checkout.html">Proceed to Checkout</a></button>
    </section>

</html>
